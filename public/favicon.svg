<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none">
  <defs>
    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A" />
      <stop offset="100%" stop-color="#8A0000" />
    </linearGradient>
    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A91A" />
      <stop offset="50%" stop-color="#FCD24A" />
      <stop offset="100%" stop-color="#E5A91A" />
    </linearGradient>
    <!-- Drop Shadow for Premium Look -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Heart Shape -->
  <path d="M150,45 C150,45 80,10 50,45 C20,80 30,120 70,160 C100,190 150,225 150,225 C150,225 200,190 230,160 C270,120 280,80 250,45 C220,10 150,45 150,45 Z" fill="url(#heartGrad)" filter="url(#shadow)" />

  <!-- Wave Shape (curving wave crest on the left, dipping in center, flowing to the right) -->
  <path d="M12,122 C42,122 62,90 92,85 C122,80 137,137 172,137 C207,137 252,112 288,122 C288,122 252,142 212,142 C172,142 147,102 117,107 C87,112 52,142 12,122 Z" fill="url(#waveGrad)" filter="url(#shadow)" />
</svg>